<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-label="commit-historian example output">
  <title>commit-historian example output</title>
  <rect width="780" height="320" rx="10" fill="#1e1e2e"/>
  <rect width="780" height="36" rx="10" fill="#181825"/>
  <rect y="26" width="780" height="10" fill="#181825"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="390" y="22" text-anchor="middle" fill="#6c7086" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" font-size="12">commit-historian — narrating src/auth/middleware.ts</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="20" y="68" fill="#a6e3a1">$</text>
    <text x="34" y="68" fill="#cdd6f4">commit-historian src/auth/middleware.ts</text>

    <text x="20" y="100" fill="#cdd6f4">Born <tspan fill="#94e2d5">`a1b2c3d`</tspan> on a Sunday: 20 lines wrapped around <tspan fill="#fab387">`jsonwebtoken`</tspan>,</text>
    <text x="20" y="118" fill="#cdd6f4">zero refresh logic, vibes-based. The Stripe outage hit in <tspan fill="#94e2d5">`e4f5a6b`</tspan></text>
    <text x="20" y="136" fill="#cdd6f4">and the file doubled in a week — <tspan fill="#94e2d5">`b7c8d9e`</tspan> bolted on rate limiting</text>
    <text x="20" y="154" fill="#cdd6f4">like a screen door on a submarine. <tspan fill="#94e2d5">`f0a1b2c`</tspan> forked the session</text>
    <text x="20" y="172" fill="#cdd6f4">types into a private copy nobody discussed for two months. The TODO</text>
    <text x="20" y="190" fill="#cdd6f4">from <tspan fill="#94e2d5">`c5d6e7f`</tspan> to <tspan fill="#fab387">&quot;revoke on logout&quot;</tspan> outlived four refactors and</text>
    <text x="20" y="208" fill="#cdd6f4">three engineers before <tspan fill="#94e2d5">`9a8b7c6`</tspan> quietly did the thing. Currently</text>
    <text x="20" y="226" fill="#cdd6f4">280 lines, technically owned by the platform team, spiritually</text>
    <text x="20" y="244" fill="#cdd6f4">owned by whoever last cried about it.</text>

    <text x="20" y="280" fill="#a6e3a1">$</text>
    <rect x="34" y="269" width="8" height="14" fill="#cdd6f4" opacity="0.7"/>
  </g>
</svg>
